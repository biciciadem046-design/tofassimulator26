<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Tofaş Simulator - Çalışan Sürüm</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0;width:100vw;height:100vh;display:block;background:#5d86b8}
#hud{position:fixed;left:12px;top:10px;z-index:10;color:white;background:rgba(0,0,0,.58);padding:10px 14px;border-radius:12px;font-weight:700;line-height:1.55;text-shadow:0 2px 2px #000}
#hud b{color:#ffd43b}
#right{position:fixed;right:12px;top:10px;z-index:10;color:white;background:rgba(0,0,0,.58);padding:10px 14px;border-radius:12px;text-align:right;font-weight:700}
#controls{position:fixed;inset:0;z-index:20;pointer-events:none}
.btn{position:absolute;pointer-events:auto;border:2px solid rgba(255,255,255,.35);background:rgba(15,15,15,.68);color:white;border-radius:18px;font-size:22px;font-weight:bold;user-select:none;-webkit-user-select:none;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 15px rgba(0,0,0,.35)}
.btn:active{background:rgba(255,190,0,.8);color:#111}
#left{left:22px;bottom:32px;width:78px;height:78px}
#rightBtn{left:112px;bottom:32px;width:78px;height:78px}
#brake{right:190px;bottom:32px;width:88px;height:78px}
#gas{right:88px;bottom:32px;width:88px;height:78px}
#gear{right:20px;bottom:125px;width:70px;height:70px}
#cam{right:20px;bottom:32px;width:55px;height:55px;font-size:16px}
#night{right:20px;top:95px;width:55px;height:55px;font-size:14px}
#start{position:fixed;z-index:30;left:50%;top:50%;transform:translate(-50%,-50%);padding:18px 28px;border:0;border-radius:18px;background:#f2b705;color:#111;font-size:20px;font-weight:800;box-shadow:0 8px 25px #0008}
#portrait{display:none;position:fixed;z-index:100;inset:0;background:#111;color:#fff;align-items:center;justify-content:center;text-align:center;font-size:24px;font-weight:800;padding:30px}
@media (orientation:portrait){#portrait{display:flex}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  🚗 <b>TOFAŞ SİMULATOR</b><br>
  Hız: <span id="speed">0</span> km/h<br>
  Devir: <span id="rpm">850</span><br>
  Vites: <span id="gearText">1</span>
</div>
<div id="right">
  💰 <span id="money">25000</span> ₺<br>
  ⛽ <span id="fuel">100</span>%<br>
  🌤️ <span id="weather">Gündüz</span>
</div>

<div id="controls">
  <div class="btn" id="left">◀</div>
  <div class="btn" id="rightBtn">▶</div>
  <div class="btn" id="brake">FREN</div>
  <div class="btn" id="gas">GAZ</div>
  <div class="btn" id="gear">VİTES</div>
  <div class="btn" id="cam">CAM</div>
  <div class="btn" id="night">GECE</div>
</div>

<button id="start">OYUNU BAŞLAT</button>
<div id="portrait">📱 Telefonu yatay çevir</div>

<script>
(() => {
"use strict";

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d",{alpha:false});
let W=1280,H=720,dpr=1;

function resize(){
  dpr=Math.min(devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  canvas.width=Math.max(1,Math.floor(W*dpr));
  canvas.height=Math.max(1,Math.floor(H*dpr));
  canvas.style.width=W+"px"; canvas.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize);
resize();

let running=false, night=false, cam=0;
let speed=0, steer=0, rpm=850, gear=1, fuel=100, money=25000;
let roadOffset=0, distance=0;
let gas=false, brake=false, left=false, right=false;
let last=performance.now();

const traffic=[
 {lane:-.55,z:.18,s:42,c:"#d93434"},
 {lane:.55,z:.34,s:34,c:"#eeeeee"},
 {lane:0,z:.56,s:30,c:"#2e63c7"},
 {lane:-.55,z:.73,s:38,c:"#e0a52b"}
];

function bind(id,down,up){
 const e=document.getElementById(id);
 ["pointerdown","touchstart"].forEach(ev=>e.addEventListener(ev,x=>{x.preventDefault();down()}));
 ["pointerup","pointercancel","pointerleave","touchend"].forEach(ev=>e.addEventListener(ev,x=>{x.preventDefault();up()}));
}
bind("gas",()=>gas=true,()=>gas=false);
bind("brake",()=>brake=true,()=>brake=false);
bind("left",()=>left=true,()=>left=false);
bind("rightBtn",()=>right=true,()=>right=false);

document.getElementById("gear").onclick=()=>{gear++;if(gear>5)gear=1};
document.getElementById("cam").onclick=()=>{cam=(cam+1)%3};
document.getElementById("night").onclick=()=>{night=!night;document.getElementById("weather").textContent=night?"Gece":"Gündüz"};

addEventListener("keydown",e=>{
 if(["ArrowUp","w","W"].includes(e.key))gas=true;
 if(["ArrowDown","s","S"].includes(e.key))brake=true;
 if(["ArrowLeft","a","A"].includes(e.key))left=true;
 if(["ArrowRight","d","D"].includes(e.key))right=true;
 if(e.key==="n"||e.key==="N")night=!night;
});
addEventListener("keyup",e=>{
 if(["ArrowUp","w","W"].includes(e.key))gas=false;
 if(["ArrowDown","s","S"].includes(e.key))brake=false;
 if(["ArrowLeft","a","A"].includes(e.key))left=false;
 if(["ArrowRight","d","D"].includes(e.key))right=false;
});

document.getElementById("start").onclick=async()=>{
 running=true;
 document.getElementById("start").style.display="none";
 try{await document.documentElement.requestFullscreen()}catch(e){}
 try{await screen.orientation.lock("landscape")}catch(e){}
};

function lerp(a,b,t){return a+(b-a)*t}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function roadY(z){return lerp(H*.50,H*.92,z)}
function roadHalf(z){return lerp(W*.055,W*.46,z)}
function roadX(z){return W/2 + steer*W*.10*z}

function drawSky(){
 ctx.fillStyle=night?"#08152d":"#68a5d9";
 ctx.fillRect(0,0,W,H*.58);
 if(!night){
   const g=ctx.createLinearGradient(0,0,0,H*.58);
   g.addColorStop(0,"#5b9bd1");g.addColorStop(1,"#b9d9ee");
   ctx.fillStyle=g;ctx.fillRect(0,0,W,H*.58);
   ctx.fillStyle="#ffd65a";ctx.beginPath();ctx.arc(W*.82,H*.16,42,0,Math.PI*2);ctx.fill();
 }else{
   ctx.fillStyle="#fff"; 
   for(let i=0;i<80;i++){let x=(i*83)%W,y=(i*47)%(H*.48);ctx.fillRect(x,y,2,2)}
   ctx.fillStyle="#ddd";ctx.beginPath();ctx.arc(W*.82,H*.16,28,0,Math.PI*2);ctx.fill();
 }
}

function drawCity(){
 ctx.fillStyle=night?"#121b2b":"#667078";
 for(let i=0;i<24;i++){
   const x=i*W/23;
   const h=45+(i*37)%130;
   ctx.fillRect(x,H*.50-h,W/28,h);
   if(i%2===0){
     ctx.fillStyle=night?"#f3d56a":"#a8c0cc";
     for(let y=H*.50-h+12;y<H*.49;y+=18)ctx.fillRect(x+8,y,7,7);
     ctx.fillStyle=night?"#121b2b":"#667078";
   }
 }
}

function drawRoad(){
 ctx.fillStyle=night?"#151515":"#4c554d";
 ctx.fillRect(0,H*.50,W,H*.50);
 // roadside
 ctx.fillStyle=night?"#0d2415":"#3d7a3b";
 ctx.fillRect(0,H*.50,W,H*.50);
 for(let i=0;i<70;i++){
   const z=((i/70+roadOffset)%1);
   const y=roadY(z), rh=roadHalf(z), x=roadX(z);
   ctx.fillStyle=night?"#202020":"#383838";
   ctx.beginPath();ctx.moveTo(x-rh,y);ctx.lineTo(x+rh,y);ctx.lineTo(x+rh*.92,y+7+z*7);ctx.lineTo(x-rh*.92,y+7+z*7);ctx.closePath();ctx.fill();
   if(i%2===0){
     ctx.fillStyle="#eee";
     const mw=Math.max(2,rh*.018);
     ctx.fillRect(x-rh/3-mw/2,y,mw,Math.max(3,12*z));
     ctx.fillRect(x+rh/3-mw/2,y,mw,Math.max(3,12*z));
   }
 }
 // guardrails
 for(let side of [-1,1]){
   ctx.strokeStyle="#aaa";ctx.lineWidth=3;
   ctx.beginPath();
   for(let i=0;i<=40;i++){const z=i/40;const y=roadY(z),rh=roadHalf(z),x=roadX(z)+side*rh*1.05;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}
   ctx.stroke();
 }
}

function drawTrees(){
 for(let i=0;i<24;i++){
   const z=((i/24+roadOffset*.8)%1);
   const y=roadY(z),rh=roadHalf(z),x=roadX(z);
   for(let side of [-1,1]){
     const tx=x+side*(rh+35+z*100), ty=y-50*z-18;
     const s=.3+z*1.2;
     ctx.fillStyle="#513a25";ctx.fillRect(tx-4*s,ty,8*s,35*s);
     ctx.fillStyle=night?"#174b28":"#27743b";
     ctx.beginPath();ctx.arc(tx,ty,22*s,0,Math.PI*2);ctx.fill();
   }
 }
}

function drawTraffic(){
 traffic.forEach((c,i)=>{
   c.z+=.0008*(speed+10);
   if(c.z>1)c.z=-.05;
   const z=c.z,y=roadY(z),rh=roadHalf(z),x=roadX(z)+c.lane*rh*.78;
   const sc=.12+z*.95;
   const w=42*sc,h=70*sc;
   ctx.save();ctx.translate(x,y-h*.55);
   ctx.fillStyle="#111";ctx.fillRect(-w*.56,-h*.12,w*.18,h*.68);ctx.fillRect(w*.38,-h*.12,w*.18,h*.68);
   ctx.fillStyle=c.c;ctx.fillRect(-w/2,-h/2,w,h*.72);
   ctx.fillStyle="#151515";ctx.fillRect(-w*.36,-h*.42,w*.72,h*.23);
   ctx.fillStyle="#f5e8c4";ctx.fillRect(-w*.38,h*.03,w*.18,h*.13);ctx.fillRect(w*.20,h*.03,w*.18,h*.13);
   ctx.restore();
 });
}

function drawPlayer(){
 const cx=W/2+steer*W*.12;
 const base=H*.84;
 const scale=cam===2?.78:1;
 ctx.save();ctx.translate(cx,base);ctx.scale(scale,scale);
 // shadow
 ctx.fillStyle="rgba(0,0,0,.45)";ctx.beginPath();ctx.ellipse(0,18,115,25,0,0,Math.PI*2);ctx.fill();
 // wheels
 ctx.fillStyle="#101010";
 for(let x of [-75,75])ctx.roundRect(x-13,-55,26,80,8),ctx.fill();
 // body
 ctx.fillStyle="#b7192a";
 ctx.beginPath();ctx.roundRect(-92,-105,184,125,18);ctx.fill();
 // bumper
 ctx.fillStyle="#c9c9c9";ctx.fillRect(-98,0,196,14);
 // windows
 ctx.fillStyle="#152b3c";
 ctx.beginPath();ctx.moveTo(-70,-98);ctx.lineTo(-42,-145);ctx.lineTo(42,-145);ctx.lineTo(70,-98);ctx.closePath();ctx.fill();
 // window divider
 ctx.fillStyle="#222";ctx.fillRect(-3,-143,6,45);
 // hood
 ctx.fillStyle="#c52232";ctx.fillRect(-74,-35,148,32);
 // grille
 ctx.fillStyle="#1c1c1c";ctx.fillRect(-48,-9,96,18);
 for(let x=-40;x<=40;x+=16){ctx.fillStyle="#aaa";ctx.fillRect(x,-8,8,2)}
 // headlights
 ctx.fillStyle="#fff1b0";ctx.fillRect(-78,-15,25,18);ctx.fillRect(53,-15,25,18);
 // tail / details
 ctx.fillStyle="#64101a";ctx.fillRect(-75,8,30,7);ctx.fillRect(45,8,30,7);
 ctx.fillStyle="#eee";ctx.font="bold 11px Arial";ctx.textAlign="center";ctx.fillText("TOFAŞ",0,-3);
 // mirrors
 ctx.fillStyle="#111";ctx.fillRect(-102,-88,18,9);ctx.fillRect(84,-88,18,9);
 ctx.restore();
}

function drawCockpit(){
 if(cam!==1)return;
 ctx.fillStyle="rgba(8,8,8,.82)";
 ctx.fillRect(0,H*.72,W,H*.28);
 ctx.strokeStyle="#ddd";ctx.lineWidth=9;
 ctx.beginPath();ctx.arc(W*.5,H*.91,85,0,Math.PI*2);ctx.stroke();
 ctx.fillStyle="#111";ctx.beginPath();ctx.arc(W*.5,H*.91,55,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#fff";ctx.font="bold 16px Arial";ctx.textAlign="center";
 ctx.fillText("TOFAŞ",W*.5,H*.915);
}

function drawMiniMap(){
 const x=W-170,y=H-145,w=145,h=125;
 ctx.fillStyle="rgba(0,0,0,.65)";ctx.fillRect(x,y,w,h);
 ctx.strokeStyle="#fff";ctx.strokeRect(x,y,w,h);
 ctx.strokeStyle="#ddd";ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(x+w/2,y);ctx.lineTo(x+w/2,y+h);ctx.stroke();
 ctx.fillStyle="#e33";ctx.beginPath();ctx.arc(x+w/2,y+h*.72,7,0,Math.PI*2);ctx.fill();
 for(let i=0;i<5;i++){ctx.fillStyle="#777";ctx.fillRect(x+10+i*25,y+10+(i*17)%90,14,10)}
}

function update(dt){
 if(!running)return;
 const target=gas?Math.min(180, speed+70*dt):speed-Math.max(4,speed*.018)*dt;
 speed=clamp(target,0,180);
 if(brake)speed=clamp(speed-120*dt,0,180);
 const st=(right?1:0)-(left?1:0);
 steer=lerp(steer,st,.14);
 roadOffset=(roadOffset+speed*dt*.00075)%1;
 distance+=speed*dt/3.6;
 fuel=clamp(fuel-speed*dt*.0008,0,100);
 rpm=850+speed*55+Math.abs(steer)*500;
 document.getElementById("speed").textContent=Math.round(speed);
 document.getElementById("rpm").textContent=Math.round(rpm);
 document.getElementById("gearText").textContent=gear;
 document.getElementById("fuel").textContent=Math.round(fuel);
}

function draw(){
 // IMPORTANT: always paint the whole canvas first
 ctx.setTransform(dpr,0,0,dpr,0,0);
 ctx.fillStyle="#5d86b8";ctx.fillRect(0,0,W,H);
 drawSky();
 drawCity();
 drawRoad();
 drawTrees();
 drawTraffic();
 drawPlayer();
 drawCockpit();
 drawMiniMap();
 if(night){ctx.fillStyle="rgba(0,0,45,.10)";ctx.fillRect(0,0,W,H)}
}

function loop(t){
 const dt=Math.min(.05,(t-last)/1000);last=t;
 update(dt);draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// Draw immediately, even before the Start button is pressed.
draw();
})();
</script>
</body>
</html>
